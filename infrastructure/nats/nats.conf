# NATS JetStream configuration for MCHPAI event bus.
# All inter-service communication flows through subjects under `mchpai.>`.

server_name: mchpai-nats
jetstream {
  store_dir: "/data"
  max_memory_store: 1GB
  max_file_store: 20GB
}

# Connection / monitoring
http: 8222
max_payload: 8MB

# Subject namespace (informational; streams are created by scripts/create_streams.sh):
#   mchpai.tokens.>      TokenCreated, TokenSnapshot
#   mchpai.wallets.>     WalletCreated/Updated, WalletBoughtToken, WalletSoldToken
#   mchpai.liquidity.>   LiquidityAdded, LiquidityRemoved
#   mchpai.signals.>     AttentionSpike, ClusterDetected, PredictionGenerated, BuySignalGenerated
#   mchpai.exec.>        TradeExecuted, fills, orders
