# MCHPAI Redis — hot cache & low-latency shared state between Rust and Python.
# Used for: token metadata cache, hot wallet state, score lookups, kill-switch
# flags (exec:paused), and the latency-critical decision cache.

maxmemory 2gb
maxmemory-policy allkeys-lru
appendonly yes
appendfsync everysec
save 900 1
save 300 100
tcp-keepalive 60
# Keyspace notifications enabled so workers can react to expirations if needed.
notify-keyspace-events Ex
