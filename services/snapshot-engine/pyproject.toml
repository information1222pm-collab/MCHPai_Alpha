[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snapshot-engine"
version = "0.1.0"
description = "MCHPAI snapshot-engine: multi-resolution token time-series (5/15/30/60s)."
requires-python = ">=3.11"
dependencies = ["mchpai-common", "numpy>=1.26"]

[tool.setuptools.packages.find]
where = ["."]
include = ["snapshot_engine*"]
