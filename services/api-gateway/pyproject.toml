[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "api-gateway"
version = "0.1.0"
description = "MCHPAI api-gateway: FastAPI REST + WebSocket surface for the platform."
requires-python = ">=3.11"
dependencies = [
    "mchpai-common",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["api_gateway*"]
