[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wallet-ingestion"
version = "0.1.0"
description = "MCHPAI wallet-ingestion: normalize transactions into wallet activity."
requires-python = ">=3.11"
dependencies = ["mchpai-common", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
include = ["wallet_ingestion*"]
