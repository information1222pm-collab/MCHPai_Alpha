[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "token-ingestion"
version = "0.1.0"
description = "MCHPAI token-ingestion service: discover new tokens across sources."
requires-python = ">=3.11"
dependencies = [
    "mchpai-common",
    "httpx>=0.27",
    "websockets>=12.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["token_ingestion*"]
