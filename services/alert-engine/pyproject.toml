[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alert-engine"
version = "0.1.0"
description = "MCHPAI alert-engine: Discord/Telegram/Email/Webhook notifications."
requires-python = ">=3.11"
dependencies = ["mchpai-common", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
include = ["alert_engine*"]
