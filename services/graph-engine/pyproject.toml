[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-engine"
version = "0.1.0"
description = "MCHPAI graph-engine: wallet/funding/token/cluster graphs + cluster detection."
requires-python = ">=3.11"
dependencies = ["mchpai-common"]

[tool.setuptools.packages.find]
where = ["."]
include = ["graph_engine*"]
