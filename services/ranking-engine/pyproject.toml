[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ranking-engine"
version = "0.1.0"
description = "MCHPAI ranking-engine: live leaderboards of wallets and clusters."
requires-python = ">=3.11"
dependencies = ["mchpai-common"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ranking_engine*"]
