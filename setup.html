<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cloudi's Rogue Setup Wizard · Shattering of Ro</title>
<style>
  :root{
    --bg:#070b14; --panel:#0c1322; --panel-2:#111b30; --edge:#1b2c49;
    --ink:#dce6f5; --muted:#7f93b3; --accent:#3f7cff; --accent-dim:#22467f;
    --rogue:#9aa7ff; --good:#39d98a; --warn:#ffcc55; --bad:#ff5d6c; --ready:#4cd2ff;
    --font:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(1200px 600px at 20% -10%, #0e1b33 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 0%, #10172b 0%, transparent 55%),
      var(--bg);
    color:var(--ink); font-family:var(--font); font-size:15px; line-height:1.55;
    -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  a{color:var(--accent)}
  code{background:#0a1222;border:1px solid var(--edge);border-radius:5px;padding:1px 6px;font-size:.9em;color:var(--rogue)}

  /* sticky character bar */
  .charbar{
    position:sticky;top:0;z-index:50;backdrop-filter:blur(8px);
    background:linear-gradient(90deg,rgba(17,27,48,.96),rgba(12,19,34,.96));
    border-bottom:1px solid var(--edge);padding:10px 18px;
  }
  .charbar .inner{max-width:1080px;margin:0 auto;display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
  .charbar .title{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.5px;margin-right:6px}
  .charbar .dagger{font-size:20px;filter:drop-shadow(0 0 6px var(--accent))}
  .field{display:flex;flex-direction:column;gap:3px}
  .field label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
  .field input{
    background:#0a1222;border:1px solid var(--edge);border-radius:8px;color:var(--ink);
    padding:7px 10px;font-size:14px;width:150px;outline:none;
  }
  .field input:focus{border-color:var(--accent)}
  .charbar .hint{font-size:11px;color:var(--muted);flex-basis:100%;margin-top:2px}

  .shell{max-width:1080px;margin:0 auto;padding:18px;display:grid;grid-template-columns:230px 1fr;gap:22px}
  @media (max-width:880px){.shell{grid-template-columns:1fr}.stepper{flex-direction:row;overflow:auto}}

  /* progress */
  .progwrap{grid-column:1/-1;margin-bottom:2px}
  .progbar{height:8px;background:#0a1222;border:1px solid var(--edge);border-radius:6px;overflow:hidden}
  .progbar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent-dim),var(--ready));transition:width .4s}
  .progtxt{font-size:12px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between}

  /* stepper nav */
  .stepper{display:flex;flex-direction:column;gap:6px;position:sticky;top:96px;align-self:start}
  .stepper button{
    text-align:left;border:1px solid transparent;background:transparent;color:var(--muted);
    padding:9px 11px;border-radius:9px;cursor:pointer;font-size:13px;display:flex;gap:9px;align-items:center;width:100%;
  }
  .stepper button .n{
    width:22px;height:22px;border-radius:50%;border:1px solid var(--edge);display:grid;place-items:center;
    font-size:12px;flex:none;color:var(--muted);
  }
  .stepper button.active{background:var(--panel-2);border-color:var(--edge);color:var(--ink)}
  .stepper button.active .n{border-color:var(--accent);color:var(--accent)}
  .stepper button.done .n{background:var(--good);border-color:var(--good);color:#04210f}

  .stage{min-height:60vh}
  .card{
    border:1px solid var(--edge);border-radius:14px;background:var(--panel);
    box-shadow:0 10px 30px rgba(0,0,0,.35);padding:24px 26px;margin-bottom:18px;
  }
  .card h2{margin:0 0 4px;font-size:22px}
  .card .lead{color:var(--muted);margin:0 0 18px}
  .eyebrow{color:var(--accent);font-size:12px;text-transform:uppercase;letter-spacing:2px;font-weight:700}
  h3{margin:22px 0 8px;font-size:16px;color:var(--rogue)}
  ul,ol{margin:8px 0 8px;padding-left:22px}
  li{margin:5px 0}

  .callout{border-left:3px solid var(--accent);background:#0a1222;border-radius:0 10px 10px 0;padding:12px 14px;margin:14px 0;font-size:14px}
  .callout.warn{border-color:var(--warn)}
  .callout.good{border-color:var(--good)}
  .callout .h{font-weight:700;display:block;margin-bottom:3px}

  details{border:1px solid var(--edge);border-radius:10px;padding:0 14px;margin:12px 0;background:#0a1222}
  details summary{cursor:pointer;padding:11px 0;font-weight:600;color:var(--ink)}
  details[open]{padding-bottom:12px}

  /* resource / code block */
  .res{border:1px solid var(--edge);border-radius:12px;background:#070d18;margin:14px 0;overflow:hidden}
  .res .top{display:flex;align-items:center;gap:8px;padding:8px 12px;background:linear-gradient(90deg,var(--panel-2),var(--panel));border-bottom:1px solid var(--edge)}
  .res .top .fn{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;color:var(--rogue)}
  .res .top .desc{color:var(--muted);font-size:12px}
  .res .top .sp{flex:1}
  .res pre{margin:0;padding:14px;overflow:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.5;color:#cfe0ff;max-height:340px}
  .btn{cursor:pointer;border:1px solid var(--edge);background:var(--panel-2);color:var(--ink);border-radius:8px;padding:6px 12px;font-size:13px;white-space:nowrap}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.go{border-color:var(--ready);color:var(--ready);background:#08233a}
  .btn.big{padding:10px 18px;font-size:14px}
  .btn:active{transform:translateY(1px)}
  .copied{border-color:var(--good)!important;color:var(--good)!important}

  /* social card */
  .social{border:1px solid var(--edge);border-radius:11px;background:#0a1222;margin:12px 0;overflow:hidden}
  .social .sh{display:flex;align-items:center;gap:10px;padding:9px 13px;border-bottom:1px solid var(--edge);background:#0c1626}
  .social .sh .nm{font-weight:700;letter-spacing:.5px;color:var(--ready)}
  .social .sh .ds{color:var(--muted);font-size:12px}
  .social .sh .sp{flex:1}
  .social .lines{padding:11px 13px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;color:#cfe0ff}
  .social .lines .ln{padding:2px 0;display:flex;gap:8px}
  .social .lines .ln b{color:var(--muted);font-weight:400;user-select:none}
  .social .note{padding:0 13px 11px;color:var(--muted);font-size:12px}

  .nav{display:flex;justify-content:space-between;gap:12px;margin-top:8px}
  .nav .spacer{flex:1}
  .check{display:flex;align-items:center;gap:10px;margin:16px 0 2px;padding:11px 13px;border:1px dashed var(--edge);border-radius:10px;cursor:pointer;background:#0a1222}
  .check input{width:18px;height:18px;accent-color:var(--good)}
  .check.done{border-style:solid;border-color:var(--good);background:#091c12}

  .pill{display:inline-block;border:1px solid var(--edge);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--rogue);background:#0a1222}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:700px){.grid2{grid-template-columns:1fr}}
  .path-pick{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
  @media(max-width:700px){.path-pick{grid-template-columns:1fr}}
  .path{border:1px solid var(--edge);border-radius:12px;padding:16px;background:#0a1222;cursor:pointer}
  .path:hover{border-color:var(--accent)}
  .path.sel{border-color:var(--ready);box-shadow:0 0 0 1px var(--ready)}
  .path h4{margin:0 0 6px;font-size:16px}
  .path .free{color:var(--good);font-weight:700;font-size:12px}
  .path p{color:var(--muted);font-size:13px;margin:6px 0 0}

  /* confetti */
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:200;overflow:hidden}
  .conf{position:absolute;width:9px;height:14px;opacity:.9;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:1}}
  .toast{position:fixed;right:18px;bottom:18px;z-index:300;background:var(--panel-2);border:1px solid var(--good);
    color:var(--ink);border-radius:10px;padding:12px 16px;box-shadow:0 10px 30px rgba(0,0,0,.5);transform:translateY(140%);transition:transform .35s}
  .toast.show{transform:none}
  .toast b{color:var(--good)}
  .finale{text-align:center;padding:14px}
  .finale .big{font-size:48px}
</style>
</head>
<body>

<!-- ============ STICKY CHARACTER BAR (personalizes everything) ============ -->
<div class="charbar">
  <div class="inner">
    <div class="title"><span class="dagger">🗡️</span> Rogue Setup Wizard</div>
    <div class="field"><label>Rogue name</label><input id="inRogue" placeholder="Cloudi" /></div>
    <div class="field"><label>Shaman name</label><input id="inShaman" placeholder="Shaman" /></div>
    <div class="field"><label>Tank / Main Assist</label><input id="inTank" placeholder="TANKNAME" /></div>
    <div class="hint">Type your names once here — every macro &amp; hotkey on this page fills in automatically. Nothing to edit by hand. Saved in your browser.</div>
  </div>
</div>

<div class="shell">
  <div class="progwrap">
    <div class="progbar"><i id="progFill"></i></div>
    <div class="progtxt"><span id="progLabel">Step 1 of 7</span><span id="progPct">0% complete</span></div>
  </div>

  <!-- ============ STEPPER ============ -->
  <nav class="stepper" id="stepper"></nav>

  <!-- ============ STAGE ============ -->
  <main class="stage" id="stage"></main>
</div>

<div id="confetti"></div>
<div class="toast" id="toast"></div>

<!-- ============ EMBEDDED RESOURCES (raw, never executed) ============ -->
<script type="text/plain" id="tpl-RogueBurn">| =====================================================================
|  RogueBurn.mac  -  Cloudi's one-key Rogue burn  (Shattering of Ro)
| ---------------------------------------------------------------------
|  Fires your full burn stack in priority order, once, then ends.
|  Bind it to a key:   /bind LeftAlt+1 /mac RogueBurn
|
|  HOW IT WORKS
|    * Each ability is only fired IF you own it AND it's off cooldown.
|    * Anything it can't find by name is silently skipped (nothing breaks),
|      so a wrong/owned-later name just means that one line does nothing.
|    * Discs: only ONE offensive disc runs at a time, so we fire the single
|      biggest one. The hand-off to later discs is sustained by RogueAssist.
|
|  >>> EDIT THE "CONFIGURE ME" BLOCK BELOW to match the exact names in your
|      AA window / Combat Abilities window.
| =====================================================================

Sub Main
    | ---------------------- CONFIGURE ME ----------------------------
    | --- Activated AAs (these STACK - fire them all). Use YOUR names. ---
    /declare AA_Spire        string local Third Spire of the Rake
    /declare AA_Fury         string local Rogue's Fury
    /declare AA_Twisted      string local Twisted Chance
    /declare AA_FrenzyAA     string local Frenzied Stabbing
    /declare AA_Ligament     string local Ligament Slice
    /declare AA_Shank        string local Twisted Shank
    /declare AA_Bane         string local Banestrike
    /declare AA_Envenom      string local Envenomed Blades
    /declare AA_Rampage      string local Focused Rampage
    /declare AA_Intensity    string local Intensity of the Resolute
    /declare AA_Absorb       string local Absorbing Agent

    | --- Your single biggest OFFENSIVE DISCIPLINE (only one runs at once) ---
    /declare DISC_Big        string local Frenzied Stabbing Discipline

    | --- Optional clicky burn item (epic-equiv / damage clicky). Blank = skip. ---
    /declare ITEM_Clicky     string local

    | --- Behavior knobs ---
    /declare StickBehind     bool   local TRUE
    | ----------------------- END CONFIG -----------------------------

    /declare gcd int local 5

    /if (!${Target.ID} || ${Target.Type.Equal[PC]}) {
        /echo \ar[RogueBurn] No valid mob target - target something first.
        /return
    }

    /echo \ag[RogueBurn] >>> BURNING <<<  Target: \ay${Target.CleanName}

    | Get behind the mob and make sure we're swinging
    /if (${StickBehind} && ${Plugin[MQ2MoveUtils].Name.Length}) /stick 12 behind
    /attack on

    | 1) Lead with the long crit buff so everything benefits
    /call FireAA "${AA_Spire}"
    | 2) Signature buff
    /call FireAA "${AA_Fury}"
    | 3) Biggest offensive disc
    /call FireDisc "${DISC_Big}"
    | 4) Open the synergy window
    /call FireAA "${AA_Twisted}"
    | 5) Debuff / damage-add
    /call FireAA "${AA_Ligament}"
    | 6) Everything else that's ready
    /call FireAA "${AA_FrenzyAA}"
    /call FireAA "${AA_Shank}"
    /call FireAA "${AA_Bane}"
    /call FireAA "${AA_Envenom}"
    /call FireAA "${AA_Rampage}"
    /call FireAA "${AA_Intensity}"
    /call FireAA "${AA_Absorb}"

    | 7) Clicky burn item, if configured
    /if (${ITEM_Clicky.Length} && ${FindItem[=${ITEM_Clicky}].ID}) {
        /useitem "${ITEM_Clicky}"
        /delay ${gcd}
    }

    | Get a backstab out immediately; RogueAssist sustains the rest
    /call Backstab

    /echo \ag[RogueBurn] Burn dumped. Keep running RogueAssist for sustained DPS.
/return

| --------------------------------------------------------------------
Sub FireAA(string Name)
    /if (!${Name.Length}) /return
    /if (${Me.AltAbility[${Name}].ID} && ${Me.AltAbilityReady[${Name}]}) {
        /alt activate ${Me.AltAbility[${Name}].ID}
        /echo \ao  fired AA: \aw${Name}
        /delay 5
    }
/return

| --------------------------------------------------------------------
Sub FireDisc(string Name)
    /if (!${Name.Length}) /return
    /if (${Me.CombatAbility[${Name}].ID} && ${Me.CombatAbilityReady[${Name}]}) {
        /disc ${Name}
        /echo \ao  fired DISC: \aw${Name}
        /delay 5
    }
/return

| --------------------------------------------------------------------
Sub Backstab
    /if (${Me.AbilityReady[Backstab]}) {
        /doability Backstab
        /delay 3
    }
/return
</script>

<script type="text/plain" id="tpl-RogueAssist">| =====================================================================
|  RogueAssist.mac  -  Cloudi's sustained DPS "spam key"  (SoR)
| ---------------------------------------------------------------------
|  The set-and-forget loop that keeps you doing damage:
|    * Assists your Main Assist and locks onto the kill target
|    * Re-asserts /attack ON after every swap (fixes the #1 hidden DPS leak)
|    * Stays behind the mob (if MQ2MoveUtils is loaded)
|    * Keeps an offensive DISCIPLINE running at all times (hand-off chain)
|    * Spams Backstab on cooldown
|    * Keeps your debuff (Ligament Slice) refreshed
|
|  Run it once and leave it:   /bind LeftAlt+2 /mac RogueAssist
|  Stop with:                  /endmacro       (LeftAlt+0 if you bound it)
| =====================================================================

Sub Main
    | ---------------------- CONFIGURE ME ----------------------------
    | Name of your Main Assist (tank/MA). Boxed solo? set to your own name
    | or leave blank to just use your current target.
    /declare MainAssist      string outer TANKNAME

    | Offensive disc hand-off chain (highest rank you own; biggest first).
    /declare Disc1           string outer Frenzied Stabbing Discipline
    /declare Disc2           string outer Executioner's Discipline
    /declare Disc3           string outer Knifeplay Discipline
    /declare Disc4           string outer Razor's Edge Discipline
    /declare Disc5           string outer Arcworker Discipline

    | Debuff to keep refreshed on the target
    /declare Debuff          string outer Ligament Slice

    /declare StickBehind     bool   outer TRUE
    | ----------------------- END CONFIG -----------------------------

    /echo \ag[RogueAssist] Sustained DPS loop running. /endmacro to stop.

    :loop
    /doevents

    | --- Acquire / refresh the kill target via the Main Assist ---
    /if (${MainAssist.Length} && ${Spawn[pc ${MainAssist}].ID}) {
        /if (${Spawn[pc ${MainAssist}].Dead}) {
            /delay 5
            /goto :loop
        }
        /assist ${MainAssist}
        /delay 3
    }

    | --- Only act on a real, attackable mob ---
    /if (!${Target.ID} || ${Target.Type.Equal[PC]} || ${Target.Type.Equal[Corpse]}) {
        /delay 5
        /goto :loop
    }
    /if (${Target.PctHPs} <= 0) {
        /delay 5
        /goto :loop
    }

    | --- Stay behind + keep swinging (the leak-proofing) ---
    /if (${StickBehind} && ${Plugin[MQ2MoveUtils].Name.Length}) {
        /if (!${Stick.Active}) /stick 12 behind
    }
    /if (!${Me.Combat}) /attack on

    | --- Keep ONE offensive disc running; start the next ready one if none ---
    /if (!${Me.ActiveDisc.ID}) {
        /call StartFirstReadyDisc
    }

    | --- Refresh debuff if it's not on the target ---
    /if (${Me.AltAbility[${Debuff}].ID} && ${Me.AltAbilityReady[${Debuff}]}) {
        /if (!${Target.FindBuff[${Debuff}].ID}) {
            /alt activate ${Me.AltAbility[${Debuff}].ID}
            /delay 4
        }
    }

    | --- Backstab on cooldown ---
    /if (${Me.AbilityReady[Backstab]}) {
        /doability Backstab
    }

    /delay 5
    /goto :loop
/return

| --------------------------------------------------------------------
Sub StartFirstReadyDisc
    /call TryDisc "${Disc1}"
    /if (${Macro.Return.Equal[done]}) /return
    /call TryDisc "${Disc2}"
    /if (${Macro.Return.Equal[done]}) /return
    /call TryDisc "${Disc3}"
    /if (${Macro.Return.Equal[done]}) /return
    /call TryDisc "${Disc4}"
    /if (${Macro.Return.Equal[done]}) /return
    /call TryDisc "${Disc5}"
/return

Sub TryDisc(string Name)
    /if (!${Name.Length}) /return skip
    /if (${Me.CombatAbility[${Name}].ID} && ${Me.CombatAbilityReady[${Name}]}) {
        /disc ${Name}
        /delay 5
        /return done
    }
/return skip
</script>

<script type="text/plain" id="tpl-BoxAssist">| =====================================================================
|  BoxAssist.mac  -  Rogue drives the Shaman box  (SoR, 2-box)
| ---------------------------------------------------------------------
|  Run this ON THE ROGUE. It keeps your boxed Shaman on your target and
|  applies slow + malo, so you never alt-tab for it.
|
|  REQUIRES a comms plugin on BOTH characters (MQ2DanNet or MQ2EQBC).
|  Bind it:   /bind LeftAlt+3 /mac BoxAssist     Stop: /endmacro
| =====================================================================

Sub Main
    | ---------------------- CONFIGURE ME ----------------------------
    /declare ShamanName      string outer Shamanname        | <-- your Shaman
    /declare SlowSpell       string outer Turgur's Swarm     | highest slow
    /declare MaloSpell       string outer Malosenia          | highest malo
    /declare Comms           string outer dannet             | "dannet" or "eqbc"
    | ----------------------- END CONFIG -----------------------------

    /echo \ag[BoxAssist] Driving Shaman (\ay${ShamanName}\ag). /endmacro to stop.

    :loop
    /doevents
    /if (!${Target.ID} || ${Target.Type.Equal[PC]} || ${Target.Type.Equal[Corpse]} || ${Target.PctHPs} <= 0) {
        /delay 10
        /goto :loop
    }
    /call BoxCmd "/target id ${Target.ID}"
    /delay 3
    /call BoxCmd "/casting \"${SlowSpell}\""
    /delay 5
    /call BoxCmd "/casting \"${MaloSpell}\""
    /delay 5
    /delay 300
    /goto :loop
/return

| --------------------------------------------------------------------
Sub BoxCmd(string Cmd)
    /if (${Comms.Equal[eqbc]}) {
        /bct ${ShamanName} /${Cmd}
    } else {
        /dex ${ShamanName} ${Cmd}
    }
/return
</script>

<script>
/* =====================================================================
   Wizard engine
   ===================================================================== */
const $ = s => document.querySelector(s);
const stepperEl = $('#stepper'), stageEl = $('#stage');
let current = 0, chosenPath = localStorage.getItem('cl_path') || '';

const chars = {
  rogue:  localStorage.getItem('cl_rogue')  || '',
  shaman: localStorage.getItem('cl_shaman') || '',
  tank:   localStorage.getItem('cl_tank')   || '',
};
$('#inRogue').value  = chars.rogue;
$('#inShaman').value = chars.shaman;
$('#inTank').value   = chars.tank;

function tpl(id){ return document.getElementById(id).textContent.replace(/^\n/,''); }

/* Personalize a template string with the character names. */
function personalize(text){
  const rogue  = chars.rogue.trim()  || 'Cloudi';
  const shaman = chars.shaman.trim() || 'Shamanname';
  const tank   = chars.tank.trim()   || 'TANKNAME';
  const repl = [
    ['ROGUENAME', rogue],
    ['SHAMANNAME', shaman],
    ['Shamanname', shaman],
    ['TANKNAME', tank],
    ['Cloudi', rogue],
  ];
  let out = text;
  for(const [k,v] of repl){ out = out.split(k).join(v); }
  return out;
}

function download(filename, text){
  const blob = new Blob([text], {type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 1500);
}
function copyText(text, btn){
  navigator.clipboard.writeText(text).then(()=>{
    const old = btn.textContent; btn.textContent = '✔ Copied'; btn.classList.add('copied');
    setTimeout(()=>{ btn.textContent = old; btn.classList.remove('copied'); }, 1400);
  }).catch(()=>{ alert('Copy failed — select the text and copy manually.'); });
}

/* ---- a downloadable / copyable file resource block ---- */
function resourceBlock(filename, desc, tplId){
  const wrap = document.createElement('div'); wrap.className='res';
  const body = personalize(tpl(tplId));
  wrap.innerHTML = `
    <div class="top">
      <span class="fn">${filename}</span>
      <span class="desc">${desc}</span>
      <span class="sp"></span>
      <button class="btn">Copy</button>
      <button class="btn go">⬇ Download</button>
    </div>
    <pre></pre>`;
  wrap.querySelector('pre').textContent = body;
  const [copyBtn, dlBtn] = wrap.querySelectorAll('button');
  copyBtn.onclick = ()=>copyText(personalize(tpl(tplId)), copyBtn);
  dlBtn.onclick   = ()=>{ download(filename, personalize(tpl(tplId))); achieve('Saved '+filename+'!'); };
  wrap.dataset.tpl = tplId; wrap.dataset.fn = filename;
  return wrap;
}

/* ---- a single in-game social hotkey card ---- */
function socialCard(s){
  const div = document.createElement('div'); div.className='social';
  const linesText = s.lines.join('\n');
  div.innerHTML = `
    <div class="sh"><span class="nm">${s.name}</span><span class="ds">${s.desc}</span>
      <span class="sp"></span><button class="btn">Copy lines</button></div>
    <div class="lines">${s.lines.map((l,i)=>`<div class="ln"><b>${i+1}</b><span>${escapeHtml(personalize(l))}</span></div>`).join('')}</div>
    ${s.note?`<div class="note">${personalize(s.note)}</div>`:''}`;
  const btn = div.querySelector('button');
  btn.onclick = ()=>copyText(personalize(linesText), btn);
  div.dataset.social = '1';
  return div;
}
function escapeHtml(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

/* ===================== STEPS ===================== */
const steps = [

  { key:'path',    title:'Pick your path', icon:'⑂', render: renderPath },
  { key:'folder',  title:'Find your game', icon:'📁', render: renderFolder },
  { key:'install', title:'Install / Open', icon:'⬇', render: renderInstall },
  { key:'drop',    title:'Add the goods', icon:'✎', render: renderDrop },
  { key:'bind',    title:'Bind your keys', icon:'⌨', render: renderBind },
  { key:'done',    title:'You’re set!', icon:'🏁', render: renderDone },
];

function buildStepper(){
  stepperEl.innerHTML='';
  steps.forEach((s,i)=>{
    const b=document.createElement('button');
    const done = localStorage.getItem('cl_done_'+s.key)==='1';
    b.className = (i===current?'active ':'')+(done?'done':'');
    b.innerHTML = `<span class="n">${done?'✓':i+1}</span><span>${s.title}</span>`;
    b.onclick=()=>go(i);
    stepperEl.appendChild(b);
  });
}
function go(i){ current=Math.max(0,Math.min(steps.length-1,i)); render(); window.scrollTo({top:0,behavior:'smooth'}); }
function markDone(key){ localStorage.setItem('cl_done_'+key,'1'); buildStepper(); updateProg(); }

function updateProg(){
  const done = steps.filter(s=>localStorage.getItem('cl_done_'+s.key)==='1').length;
  const pct = Math.round(done/steps.length*100);
  $('#progFill').style.width = pct+'%';
  $('#progLabel').textContent = `Step ${current+1} of ${steps.length} · ${steps[current].title}`;
  $('#progPct').textContent = pct+'% complete';
}

function navButtons(opts={}){
  const wrap=document.createElement('div'); wrap.className='nav';
  const back=document.createElement('button'); back.className='btn'; back.textContent='← Back';
  back.onclick=()=>go(current-1); if(current===0) back.style.visibility='hidden';
  const sp=document.createElement('div'); sp.className='spacer';
  const next=document.createElement('button'); next.className='btn go big';
  next.textContent = opts.nextLabel || 'Next step →';
  next.onclick=()=>{ markDone(steps[current].key); if(opts.onNext) opts.onNext(); go(current+1); };
  wrap.append(back,sp,next);
  if(current===steps.length-1){ next.style.visibility='hidden'; }
  return wrap;
}

/* ---------- effects ---------- */
function achieve(msg){
  const t=$('#toast'); t.innerHTML='<b>✔</b> '+msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1900);
}
function fireConfetti(){
  const box=$('#confetti'); const colors=['#3f7cff','#4cd2ff','#9aa7ff','#39d98a','#ffcc55'];
  for(let i=0;i<90;i++){
    const d=document.createElement('div'); d.className='conf';
    d.style.left=Math.random()*100+'vw'; d.style.background=colors[i%colors.length];
    d.style.animationDuration=(2+Math.random()*2)+'s'; d.style.animationDelay=(Math.random()*0.5)+'s';
    d.style.top=(-10-Math.random()*20)+'vh';
    box.appendChild(d); setTimeout(()=>d.remove(),4200);
  }
}

  render();
}

    const map={inRogue:'rogue',inShaman:'shaman',inTank:'tank'};
    chars[map[id]] = e.target.value;
    localStorage.setItem('cl_'+map[id], e.target.value);
    // refresh any visible personalized content
    document.querySelectorAll('.res[data-tpl]').forEach(r=>{ r.querySelector('pre').textContent=personalize(tpl(r.dataset.tpl)); });

});

function render(){ steps[current].render(); buildStepper(); updateProg(); }
