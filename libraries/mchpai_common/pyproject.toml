[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mchpai-common"
version = "0.1.0"
description = "MCHPAI shared library: schemas, events, datastore clients, and domain sciences."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "nats-py>=2.7",
    "redis>=5.0",
    "asyncpg>=0.29",
    "clickhouse-connect>=0.7",
    "neo4j>=5.18",
    "minio>=7.2",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "orjson>=3.10",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mchpai_common*"]

[tool.ruff]
line-length = 100
target-version = "py311"
